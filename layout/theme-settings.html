<!-- ================= THEME SETTINGS BUTTON ================= -->
<div class="customizer-setting d-none d-md-block">
<div
  class="btn-info rounded-pill shadow-lg btn btn-icon btn-lg p-2"
  data-bs-toggle="offcanvas"
  data-bs-target="#theme-settings-offcanvas"
  aria-controls="theme-settings-offcanvas"
>
  <i class="mdi mdi-spin mdi-cog-outline fs-22"></i>
</div>
</div>

<!-- ================= THEME SETTINGS OFFCANVAS ================= -->
<div
class="offcanvas offcanvas-end border-0"
tabindex="-1"
id="theme-settings-offcanvas"
>
<div class="d-flex align-items-center bg-primary bg-gradient p-3 offcanvas-header">
<h5 class="m-0 me-2 text-white">Theme Customizer</h5>
<button
  type="button"
  class="btn-close btn-close-white ms-auto"
  data-bs-dismiss="offcanvas"
  aria-label="Close"
></button>
</div>

<div class="offcanvas-body p-0">
  <div data-simplebar class="h-100">
    <div class="p-4">

      <!-- ========== LAYOUT ========== -->
      <h6 class="mb-0 fw-semibold text-uppercase">Layout</h6>
      <p class="text-muted">Choose your layout</p>

      <div class="row gy-3">
        <div class="col-4">
          <div class="form-check card-radio">
            <input class="form-check-input" type="radio" name="data-layout" value="vertical" />
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Vertical</h5>
        </div>

        <div class="col-4">
          <div class="form-check card-radio">
            <input class="form-check-input" type="radio" name="data-layout" value="horizontal" />
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Horizontal</h5>
        </div>

        <div class="col-4">
          <div class="form-check card-radio">
            <input class="form-check-input" type="radio" name="data-layout" value="twocolumn" />
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Two Column</h5>
        </div>
      </div>

      <!-- ========== COLOR SCHEME ========== -->
      <h6 class="mt-4 mb-0 fw-semibold text-uppercase">Color Scheme</h6>
      <p class="text-muted">Choose Light or Dark.</p>

      <div class="row">
        <div class="col-4">
          <div class="form-check card-radio">
            <input class="form-check-input" type="radio" name="data-bs-theme" id="layout-mode-light" value="light" /> 
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Light</h5>
        </div>

        <div class="col-4">
          <div class="form-check card-radio">
            <input class="form-check-input" type="radio" name="data-bs-theme" id="layout-mode-dark" value="dark" />
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Dark</h5>
        </div>
      </div>

      <!-- ========== SIDEBAR SIZE ========== -->
      <h6 class="mt-4 mb-0 fw-semibold text-uppercase">Sidebar Size</h6>
      <p class="text-muted">Choose sidebar size</p>

      <div class="row">
        <div class="col-4">
          <div class="form-check sidebar-setting card-radio">
            <input class="form-check-input" type="radio" name="data-sidebar-size" value="lg" />
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Default</h5>
        </div>

        <div class="col-4">
          <div class="form-check sidebar-setting card-radio">
            <input class="form-check-input" type="radio" name="data-sidebar-size" value="sm" />
            <label class="form-check-label p-0 avatar-md w-100"></label>
          </div>
          <h5 class="fs-13 text-center mt-2">Small</h5>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ========== FOOTER ========== -->
<div class="offcanvas-footer border-top p-3 text-center">
  <div class="row">
    <div class="col-6">
      <button type="button" class="btn btn-light w-100" id="reset-layout">
        Reset
      </button>
    </div>
    <div class="col-6">
      <a
        href="https://1.envato.market/velzon-admin"
        target="_blank"
        class="btn btn-primary w-100"
      >
        Buy Now
      </a>
    </div>
  </div>
</div>
</div>
