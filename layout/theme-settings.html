<div class="theme-settings">
  <!-- ================= THEME SETTINGS BUTTON ================= -->
  <div class="customizer-setting d-none d-md-block">
    <div
      class="btn-info rounded-pill shadow-lg btn btn-icon btn-lg p-2"
      data-bs-toggle="offcanvas"
      data-bs-target="#theme-settings-offcanvas"
      aria-controls="theme-settings-offcanvas"
    >
      <i class="mdi mdi-spin mdi-cog-outline fs-22"></i>
    </div>
  </div>

  <!-- ================= THEME SETTINGS OFFCANVAS ================= -->
  <div
    class="offcanvas offcanvas-end border-0"
    tabindex="-1"
    id="theme-settings-offcanvas"
  >
    <div
      class="d-flex align-items-center bg-primary bg-gradient p-3 offcanvas-header"
    >
      <h5 class="m-0 me-2 text-white">Theme Settings</h5>

      <button
        type="button"
        class="btn-close btn-close-white ms-auto"
        id="customizerclose-btn"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body p-0">
      <div data-simplebar class="h-100">
        <div class="p-4">
          <h6 class="mb-0 fw-semibold text-uppercase">Layout</h6>
          <p class="text-muted">Choose your layout</p>

          <div class="row gy-3">
            <div class="col-4">
              <div class="form-check card-radio">
                <input
                  id="customizer-layout01"
                  name="data-layout"
                  type="radio"
                  value="vertical"
                  class="form-check-input"
                />
                <label
                  class="form-check-label p-0 avatar-md w-100"
                  for="customizer-layout01"
                >
                  <span class="d-flex gap-1 h-100">
                    <span class="flex-shrink-0">
                      <span class="bg-light d-flex h-100 flex-column gap-1 p-1">
                        <span
                          class="d-block p-1 px-2 bg-primary-subtle rounded mb-2"
                        ></span>
                        <span
                          class="d-block p-1 px-2 pb-0 bg-primary-subtle"
                        ></span>
                        <span
                          class="d-block p-1 px-2 pb-0 bg-primary-subtle"
                        ></span>
                        <span
                          class="d-block p-1 px-2 pb-0 bg-primary-subtle"
                        ></span>
                      </span>
                    </span>
                    <span class="flex-grow-1">
                      <span class="d-flex h-100 flex-column">
                        <span class="bg-light d-block p-1"></span>
                        <span class="bg-light d-block p-1 mt-auto"></span>
                      </span>
                    </span>
                  </span>
                </label>
              </div>
              <h5 class="fs-13 text-center mt-2">Vertical</h5>
            </div>
            <div class="col-4">
              <div class="form-check card-radio">
                <input
                  id="customizer-layout02"
                  name="data-layout"
                  type="radio"
                  value="horizontal"
                  class="form-check-input"
                />
                <label
                  class="form-check-label p-0 avatar-md w-100"
                  for="customizer-layout02"
                >
                  <span class="d-flex h-100 flex-column gap-1">
                    <span class="bg-light d-flex p-1 gap-1 align-items-center">
                      <span
                        class="d-block p-1 bg-primary-subtle rounded me-1"
                      ></span>
                      <span
                        class="d-block p-1 pb-0 px-2 bg-primary-subtle ms-auto"
                      ></span>
                      <span
                        class="d-block p-1 pb-0 px-2 bg-primary-subtle"
                      ></span>
                    </span>
                    <span class="bg-light d-block p-1"></span>
                    <span class="bg-light d-block p-1 mt-auto"></span>
                  </span>
                </label>
              </div>
              <h5 class="fs-13 text-center mt-2">Horizontal</h5>
            </div>
          </div>

          <h6 class="mt-4 mb-0 fw-semibold text-uppercase">Color Scheme</h6>
          <p class="text-muted">Choose Light or Dark Scheme.</p>

          <div class="colorscheme-cardradio">
            <div class="row">
              <div class="col-4">
                <div class="form-check card-radio">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="data-bs-theme"
                    id="layout-mode-light"
                    value="light"
                  />
                  <label
                    class="form-check-label p-0 avatar-md w-100"
                    for="layout-mode-light"
                  >
                    <span class="d-flex gap-1 h-100">
                      <span class="flex-shrink-0">
                        <span
                          class="bg-light d-flex h-100 flex-column gap-1 p-1"
                        >
                          <span
                            class="d-block p-1 px-2 bg-primary-subtle rounded mb-2"
                          ></span>
                          <span
                            class="d-block p-1 px-2 pb-0 bg-primary-subtle"
                          ></span>
                          <span
                            class="d-block p-1 px-2 pb-0 bg-primary-subtle"
                          ></span>
                          <span
                            class="d-block p-1 px-2 pb-0 bg-primary-subtle"
                          ></span>
                        </span>
                      </span>
                      <span class="flex-grow-1">
                        <span class="d-flex h-100 flex-column">
                          <span class="bg-light d-block p-1"></span>
                          <span class="bg-light d-block p-1 mt-auto"></span>
                        </span>
                      </span>
                    </span>
                  </label>
                </div>
                <h5 class="fs-13 text-center mt-2">Light</h5>
              </div>

              <div class="col-4">
                <div class="form-check card-radio dark">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="data-bs-theme"
                    id="layout-mode-dark"
                    value="dark"
                  />
                  <label
                    class="form-check-label p-0 avatar-md w-100 bg-dark"
                    for="layout-mode-dark"
                  >
                    <span class="d-flex gap-1 h-100">
                      <span class="flex-shrink-0">
                        <span
                          class="bg-white bg-opacity-10 d-flex h-100 flex-column gap-1 p-1"
                        >
                          <span
                            class="d-block p-1 px-2 bg-white bg-opacity-10 rounded mb-2"
                          ></span>
                          <span
                            class="d-block p-1 px-2 pb-0 bg-white bg-opacity-10"
                          ></span>
                          <span
                            class="d-block p-1 px-2 pb-0 bg-white bg-opacity-10"
                          ></span>
                          <span
                            class="d-block p-1 px-2 pb-0 bg-white bg-opacity-10"
                          ></span>
                        </span>
                      </span>
                      <span class="flex-grow-1">
                        <span class="d-flex h-100 flex-column">
                          <span
                            class="bg-white bg-opacity-10 d-block p-1"
                          ></span>
                          <span
                            class="bg-white bg-opacity-10 d-block p-1 mt-auto"
                          ></span>
                        </span>
                      </span>
                    </span>
                  </label>
                </div>
                <h5 class="fs-13 text-center mt-2">Dark</h5>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
