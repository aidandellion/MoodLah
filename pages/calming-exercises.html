<!-- Bootstrap row for page header -->
<div class="row">
    <div class="col-12">
        <!-- Page title container -->
        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
            <!-- Page title -->
            <h4 class="mb-sm-0">Calming Exercises</h4>

            <!-- This paragraph is UPDATED BY JAVASCRIPT
                 to show the user's mood information -->
            <p class="text-muted" id="moodInfo"></p>
        </div>
    </div>
</div>

<!-- Container for the calming exercises list -->
<div class="row">
  <div class="col-xl-8">

    <!-- Card that is hidden by default (d-none)
         It will be shown by JavaScript once exercises are generated -->
    <div class="card d-none" id="exerciseCard">
      <div class="card-body">

        <!-- Card title -->
        <h5 class="card-title mb-3">Recommended Exercises</h5>

        <!-- List that JavaScript will dynamically fill
             with calming exercises -->
        <ul id="exerciseList" class="list-group list-group-flush"></ul>

      </div>
    </div>
  </div>
</div>
