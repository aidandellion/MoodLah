<div class="row">
    <div class="col-12">
        <div class="page-title-box d-sm-flex align-items-center justify-content-between">
            <h4 class="mb-sm-0">Mood History</h4>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header align-items-center d-flex">
                <h4 class="card-title mb-0 flex-grow-1">Your Mood Journey</h4>
                <div class="flex-shrink-0">
                    <button id="clearHistoryBtn" class="btn btn-soft-danger btn-sm">
                        <i class="ri-delete-bin-line align-middle"></i> Clear History
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="historyTable">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Date</th>
                                <th scope="col">Mood</th>
                                <th scope="col">Note</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <!-- Rows go here -->
                        </tbody>
                    </table>
                </div>

                <div id="historyEmpty" class="text-center py-5 d-none">
                    <h5 class="text-muted">No entries yet!</h5>
                    <a href="layout.html?page=mood-tracking" class="btn btn-primary btn-sm mt-2">Track Today</a>
                </div>
            </div>
        </div>
    </div>
</div>
